# SPDX-License-Identifier: LGPL-3.0-or-later
# Geometry optimization benchmark case definitions.
# The runner embeds the SMILES cases. XYZ paths are relative to this file.
# uhf gives the number of unpaired electrons.
# Baker cases come from J. Baker, J. Comput. Chem. 14, 1085 (1993).
# The runner generates fresh starting geometries from SMILES.
# Drug cases match MOLECULES in ReShiki's crates/optimize/examples/mmff_benchmark.rs.
# The key is (set, name) because some molecules appear in more than one set.

[[cases]]
name = "water"
set = "baker"
smiles = 'O'
charge = 0
uhf = 0

