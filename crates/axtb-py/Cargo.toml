[package]
name = "axtb-py"
description = "Python bindings of axtb (the PyPI package axtb, built with maturin)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# published as wheels on PyPI (pyproject.toml), not on crates.io
publish = false

[lib]
name = "_axtb"
crate-type = ["cdylib"]

[features]
default = ["gxtb"]
gxtb = ["axtb-driver/gxtb"]

[dependencies]
axtb = { workspace = true }
# request validation, dispatch to the methods and the response
axtb-driver = { workspace = true, default-features = false }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py311"] }
numpy = "0.23"
# exact decimal-to-double parsing of the driver requests (the default parser can be 1 ulp off)
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = "1"
# the solvent names of the implicit-solvent models (planning in Python)
axtb-solvation = { workspace = true }

[lints]
workspace = true
