[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "axtb"
description = "Extended tight binding (GFN2-xTB, g-xTB) and the GFN-FF force field as a program of the qc* stack: energies, gradients, Hessians, vibrational analysis"
readme = "README.md"
requires-python = ">=3.11"
# every part, g-xTB included (LICENSE, NOTICE)
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER", "LICENSE", "NOTICE"]
authors = [{ name = "Colton Hicks" }]
keywords = ["quantum chemistry", "tight binding", "xtb", "g-xtb", "gfn-ff", "qcdata", "qccompute"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.22", "qcdata>=0.24.0,<0.25"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/atomsforhumanity/axtb"
Documentation = "https://github.com/atomsforhumanity/axtb#readme"
Repository = "https://github.com/atomsforhumanity/axtb"
Issues = "https://github.com/atomsforhumanity/axtb/issues"
Changelog = "https://github.com/atomsforhumanity/axtb/blob/main/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "axtb._axtb"
features = ["pyo3/extension-module"]
# The workspace's [patch.crates-io] points at third_party/, which the sdist needs too. maturin
# takes include paths relative to this directory only, so crates/axtb-py/third_party is a
# symbolic link to the top-level third_party/; in the sdist it lands next to the workspace's
# Cargo.toml, where the patch expects it.
include = [{ path = "third_party/**/*", format = "sdist" }]
# the wheels ship without debug info (the release profile keeps line tables for profiling)
strip = true
# PyPI wheels run on glibc 2.28 or newer: build them in the manylinux_2_28 container
# (.github/workflows/release.yml) or with --zig. On a newer host `maturin build` refuses them;
# `--compatibility linux` builds a wheel for the host itself. pip's builds from source (PEP 517)
# always tag the wheel for the host.
compatibility = "manylinux_2_28"

[project.optional-dependencies]
# the tests: the conformance checks (qccompute.testing.check_program, with jsonschema) and the
# runner and worker tests
test = ["pytest", "qccompute[testing]>=0.23.0,<0.24"]

# axtb as a program of qccompute (qccompute.program.find_program("axtb")); no qccompute import at
# run time: the protocol is structural
[project.entry-points."qccompute.programs"]
axtb = "axtb:program"

# python/axtb (scripts/check.sh fast: ruff check, ruff format --check, mypy)
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["python/axtb"]
warn_unused_ignores = true

